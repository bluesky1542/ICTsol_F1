services:
  - type: web
    name: ictsol-f1
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: REQUIRE_DATABASE_URL
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
