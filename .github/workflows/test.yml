name: Verify app
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: ictsol_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ictsol_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
        working-directory: backend
      - run: python -m unittest discover -s tests -v
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/ictsol_test?sslmode=disable
      - run: npm ci && npm run typecheck
        working-directory: mobile
      - run: npx expo export --platform web
        working-directory: mobile
        env:
          EXPO_PUBLIC_DEMO_MODE: "0"
          EXPO_PUBLIC_API_BASE_URL: "/"
      - run: python verify_release.py
        working-directory: backend
